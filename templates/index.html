<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Vietnamese Mistakes</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    {{ bootstrap.load_css() }}
    {{ bootstrap.load_js() }}
</head>
<body>
    <!-- Fixed Header -->
    <div class="fixed-header py-3 bg-info text-white">
        <h1 class="text-center">Welcome to Fix Vietnamese Mistakes</h1>
    </div>

    <!-- Error Message Section -->
    <div id="error-message" class="alert alert-danger text-center" style="display:none;">
        <span id="error-text"></span>
    </div>

    <!-- Loading Spinner Section -->
    <div id="loading-spinner" class="text-center" style="display:none;">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>

    <div class="container-fluid w-75 mt-3">
        <div class="container justify-content-center">
            <div class="row d-flex justify-content-center py-5">
                <div class="col d-flex justify-content-center">
                    <textarea id="input-box" class="form-control form-control-lg rounded" rows="10" placeholder="Enter something..." oninput="autoResize(this)"></textarea>
                </div>
                <div class="col d-flex justify-content-center">
                    <textarea id="output-box" class="form-control form-control-lg rounded" rows="10" placeholder="Fixed value will appear here..." readonly></textarea>
                </div>
            </div>
            <div class="row d-flex justify-content-center">
                <div class="col-12 col-md-6 d-flex justify-content-around">
                    <button type="button" class="btn btn-warning rounded border border-dark" id="fix-button">Fix Mistake</button>
                    <button type="button" class="btn btn-secondary rounded border border-dark" id="clear-button">Clear Form</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Footer section -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p>&copy; 2025 DA2 - 51900447 - 51800595 | All Rights Reserved</p>
    </footer>
    <script>
        $(document).ready(function(){
            $('#fix-button').click(function(){
                // Get the value from the input box
                var input_value = $('#input-box').val();

                // Hide any previous error messages
                $('#error-message').hide();
                // Show the loading spinner
                $('#loading-spinner').show();

                // Send the input value to the Flask backend using AJAX
                $.ajax({
                    url: '/correct',
                    type: 'POST',
                    data: { incorrect_text: input_value },
                    success: function(response){
                        // Hide the loading spinner once the response is received
                        $('#loading-spinner').hide();

                        if (response.data && response.data.corrected_text) {
                            // Update the output box with the fixed value from the response
                            $('#output-box').val(response.data.corrected_text);
                        } else {
                            // Show error message if corrected_text is missing in the response
                            showError('Something went wrong, no corrected text returned.');
                        }
                    },
                    error: function(xhr, status, error) {
                        // Hide the loading spinner if the request fails
                        $('#loading-spinner').hide();
                        let errorMessage = 'Failed to connect to the server.';

                        if (xhr.responseJSON.message) {
                            errorMessage = xhr.responseJSON.message;
                        }
                        // Show error if AJAX request fails
                        showError(errorMessage);
                    }
                });
            });

            // When clicking the "Clear Form" button
            $('#clear-button').click(function(){
                // Clear content in the input boxes
                $('#input-box').val('');
                $('#output-box').val('');
                // Hide any previous error messages
                $('#error-message').hide();
                // Hide the loading spinner
                $('#loading-spinner').hide();
            });
        });

        // Auto resize function for textarea
        function autoResize(textarea) {
            textarea.style.height = 'auto'; // Reset height to auto to shrink if necessary
            textarea.style.height = (textarea.scrollHeight) + 'px'; // Set height to scrollHeight
        }

        // Function to display error messages
        function showError(message) {
            $('#error-text').text(message);
            $('#error-message').show();
        }
    </script>
</body>
</html>
